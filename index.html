<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8f7" />
    <meta
      name="description"
      content="MediStock helps pharmacies track medicines, monitor inventory levels, and detect upcoming expiries before they become costly problems."
    />
    <title>MediStock — Pharmacy Inventory & Expiry Intelligence</title>
    <script>
      // Apply theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('medistock-prefs') || '{}')
        var t = s && s.state && s.state.theme
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
