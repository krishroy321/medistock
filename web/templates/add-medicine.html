{% extends "base.html" %}
{% block title %}Add Medicine — MediStock{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Inventory</p><h1>Add Medicine</h1></div><a class="button secondary" href="{{ url_for('medicines') }}">Back to inventory</a></div>
<article class="panel form-panel">
<form method="post">
<input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
<div class="form-grid">
  <label>Medicine ID<input name="medicine_id" value="{{ medicine.medicine_id|default('') }}" placeholder="MED041" required></label>
  <label>Medicine Name<input name="medicine_name" value="{{ medicine.medicine_name|default('') }}" required></label>
  <label>Category<select name="category" required><option value="">Select category</option>{% for value in categories %}<option {{ 'selected' if medicine.category|default('')==value }}>{{ value }}</option>{% endfor %}</select></label>
  <label>Dosage Form<select name="form" required><option value="">Select form</option>{% for value in forms %}<option {{ 'selected' if medicine.form|default('')==value }}>{{ value }}</option>{% endfor %}</select></label>
  <label>Manufacturer<input name="manufacturer" value="{{ medicine.manufacturer|default('') }}" required></label>
  <label>Batch Number<input name="batch_number" value="{{ medicine.batch_number|default('') }}" required></label>
  <label>Quantity<input name="quantity" type="number" min="1" step="1" value="{{ medicine.quantity|default('') }}" required></label>
  <label>Minimum Stock<input name="minimum_stock" type="number" min="1" step="1" value="{{ medicine.minimum_stock|default('') }}" required></label>
  <label>Unit Price<input name="unit_price" type="number" min="0.01" step="0.01" value="{{ medicine.unit_price|default('') }}" required></label>
  <label>Manufacturing Date<input name="manufacturing_date" type="date" value="{{ medicine.manufacturing_date|default('') }}" required></label>
  <label>Expiry Date<input name="expiry_date" type="date" value="{{ medicine.expiry_date|default('') }}" required></label>
  <label>Supplier<input name="supplier" value="{{ medicine.supplier|default('') }}" required></label>
</div>
<div class="form-actions"><a class="button secondary" href="{{ url_for('medicines') }}">Cancel</a><button class="button primary" type="submit">Add Medicine</button></div>
</form></article>
{% endblock %}
